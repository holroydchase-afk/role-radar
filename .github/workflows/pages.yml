name: pages
# Builds the public demo and publishes it with GitHub Pages, at chaseholroyd.com/role-radar/
# (this account's user site maps other repos' Pages to /<repo>/). Demo data only, from main only.
# One-time setup by the repo owner: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Personal-data check
        run: node scripts/check-private.mjs
      - name: Studio checks (agent roster, log hygiene)
        run: bash scripts/check-agents.sh && node scripts/check-logs.mjs
      - name: Unit tests
        run: node --test tests/scoring.test.mjs tests/alerts.test.mjs tests/gmail-import.test.mjs tests/check-private.test.mjs tests/demo.test.mjs
      - name: Build the public demo
        run: node scripts/build-demo.mjs --public _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
