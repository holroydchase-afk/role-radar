name: pages
# Builds the public demo and publishes it with GitHub Pages, at chaseholroyd.com/role-radar/
# (this account's user site maps other repos' Pages to /<repo>/). Demo data only, from main only,
# and only after the ci workflow (full test suite) has passed on that commit.
# One-time setup by the repo owner: Settings → Pages → Source: GitHub Actions.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Personal-data check
        run: node scripts/check-private.mjs
      - name: Studio checks (agent roster, log hygiene)
        run: bash scripts/check-agents.sh && node scripts/check-logs.mjs
      - name: Unit tests
        run: node --test tests/scoring.test.ts tests/alerts.test.ts tests/gmail-import.test.ts tests/check-private.test.ts tests/demo.test.ts
      - name: Build the public demo
        run: node scripts/build-demo.mjs --public _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can publish; the build job (which runs npm ci) stays read-only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
